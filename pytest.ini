[pytest]
asyncio_mode = auto
markers =
    integration: tests que requieren credenciales/conectividad externa (p. ej. Firestore prod); hacen skip graceful sin ellas
# [BOT-BUILD-REFACTOR-03-05-RESIDUAL] La zona de cuarentena (attic/) contiene
# artefactos muertos que NO deben recolectarse: su importación envenena el
# estado global (singletons) y altera el orden de ejecución de la suite.
norecursedirs = attic node_modules .* build dist *.egg *.egg-info __pycache__
