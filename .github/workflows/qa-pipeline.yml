name: Antigravity WA Bot CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    
    env:
      TEST_MODE: "true"
      ADMIN_API_KEY: "${{ secrets.ADMIN_API_KEY }}"
      WHATSAPP_TOKEN: "${{ secrets.WHATSAPP_TOKEN }}"
      PHONE_NUMBER_ID: "${{ secrets.PHONE_NUMBER_ID }}"
      WEBHOOK_VERIFY_TOKEN: "${{ secrets.WEBHOOK_VERIFY_TOKEN }}"
      FIRESTORE_COLLECTION: "prospectos"
      GOOGLE_APPLICATION_CREDENTIALS: "/tmp/fake-key.json"

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: Install Dependencies
        run: |
          npm install
          uv venv
          uv pip install -r requirements.txt
          npx playwright install --with-deps

      - name: Run Scaffold Check
        run: npx agent-cli scaffold --check

      - name: Spin up Whap Mock Server
        run: |
          npm run whap:server &
          sleep 3

      - name: Spin up FastAPI Bot Server
        run: |
          uv run uvicorn app.main:app --port 8000 &
          sleep 5

      - name: Execute Playwright Integration Tests
        run: npx playwright test tests/integration/whatsapp_webhook.spec.js

      - name: Run Conversational Regression (Botium)
        run: npm test -- --botium tests/conversational/TC_simulacion_ciega.convo.txt

      - name: Install Grafana k6
        run: |
          curl -sL https://dl.k6.io/key.gpg | sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --import
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Execute Performance Test (Grafana k6)
        uses: grafana/run-k6-action@v1
        with:
          path: tests/performance/test_k6.js

      - name: Evaluate Coherence Score Final Gate
        run: npx agent-cli eval
