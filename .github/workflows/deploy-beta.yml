name: Deploy Beta to Cloud Run

on:
  push:
    branches:
      - beta

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2


      - name: Deploy to Cloud Run
        run: |
          cd ${GITHUB_WORKSPACE}
          pwd
          ls -la
          uvx google-agents-cli deploy bot-tiendalasmotos-beta \
            --region us-central1 \
            --allow-unauthenticated \
            --project tiendalasmotos \
            --set-env-vars="PHONE_NUMBER_ID=${{ secrets.BETA_PHONE_NUMBER_ID }},WHATSAPP_TOKEN=${{ secrets.BETA_WHATSAPP_TOKEN }},FIRESTORE_COLLECTION=prospectos"
