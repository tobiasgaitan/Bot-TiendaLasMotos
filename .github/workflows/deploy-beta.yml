name: Deploy Beta to Cloud Run

on:
  push:
    branches:
      - beta

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Pre-clone S-TOON Protocol
        run: |
          git clone https://github.com/azimuth-logic-research/S-TOON-Protocol.git S-TOON-Protocol
          mv S-TOON-Protocol/.git S-TOON-Protocol/git_dir

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # [BOT-PLAN-CICD-IAM-205] IAM JAMÁS se muta desde este pipeline (403 forense del
      # run 29888880244: la SA de deploy no tiene ni debe tener privilegios de admin IAM).
      # El acceso runtime al secreto está provisionado a NIVEL PROYECTO
      # (roles/secretmanager.secretAccessor heredado):
      #   - runtime beta: <PROJECT_NUMBER>-compute@developer.gserviceaccount.com
      #   - runtime prod: bot-admin@tiendalasmotos.iam.gserviceaccount.com
      # La SA de deploy (github-actions-deploy@) solo posee secretAccessor a nivel
      # RECURSO sobre WHATSAPP_TOKEN (bootstrap one-time ejecutado por el owner):
      #   gcloud secrets add-iam-policy-binding WHATSAPP_TOKEN --project tiendalasmotos \
      #     --member="serviceAccount:github-actions-deploy@tiendalasmotos.iam.gserviceaccount.com" \
      #     --role="roles/secretmanager.secretAccessor"
      # Reaplicar ÚNICAMENTE si el secreto se recrea. El Regression Guard de
      # qa-pipeline.yml bloquea la reintroducción de pasos IAM en workflows.

      # [BOT-PLAN-CICD-SECRET-LIST-206] Se ERRADICÓ la resolución manual de versiones:
      # 'gcloud secrets versions list' exige secretmanager.viewer (privilegio de
      # metadata que la SA de deploy NO posee ni poseerá — PERMISSION_DENIED forense
      # del run 29890766582; y su rama de error mentía: el secreto SÍ tenía 2
      # versiones ENABLED). El binding usa el alias 'latest', que Cloud Run resuelve
      # en la creación de la revisión (inmutable → rollback determinista preservado;
      # estado vivo ya probado: secretRef → WHATSAPP_TOKEN:latest).
      # Pre-flight pasivo con el permiso YA concedido (versions.access, PASO 0 del
      # ticket 205): falla rápido si el secreto no tuviera payload ENABLED accesible.
      - name: Pre-flight — WHATSAPP_TOKEN payload accesible (latest)
        run: |
          if ! gcloud secrets versions access latest --secret=WHATSAPP_TOKEN --project=tiendalasmotos > /dev/null; then
            echo "❌ FORENSIC: secreto WHATSAPP_TOKEN sin payload ENABLED accesible (o bootstrap 205 ausente)."
            echo "   Bootstrap: printf '%s' '<system-user-token>' | gcloud secrets versions add WHATSAPP_TOKEN --data-file=- --project=tiendalasmotos"
            exit 1
          fi
          echo "✅ FORENSIC: payload WHATSAPP_TOKEN accesible vía alias latest (sin lectura de metadata)."

      # [BOT-BUILD-INFRA-TOKEN-ROTATION-201] WHATSAPP_TOKEN ya no viaja en texto plano
      # desde GitHub Secrets. --set-env-vars reemplaza TODAS las env vars, por lo que el
      # binding del secreto se hace en el MISMO deploy (--set-secrets): revisión atómica,
      # sin ventana sin credencial.
      # [BOT-PLAN-CICD-SECRET-LIST-206] Alias 'latest': resolución server-side en la
      # creación de la revisión; cero lectura de metadata de secretos desde CI.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bot-tiendalasmotos-beta \
            --source . \
            --region us-central1 \
            --project tiendalasmotos \
            --set-env-vars="PHONE_NUMBER_ID=${{ secrets.BETA_PHONE_NUMBER_ID }},FIRESTORE_COLLECTION=prospectos,WEBHOOK_VERIFY_TOKEN=${{ secrets.WEBHOOK_VERIFY_TOKEN }},ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }},WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET }},LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }},LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }},LANGFUSE_HOST=https://cloud.langfuse.com,GEMINI_COLD_CALL_TIMEOUT_S=30" \
            --set-secrets="WHATSAPP_TOKEN=WHATSAPP_TOKEN:latest,QWEN_OMNI_API_KEY=QWEN_OMNI_API_KEY:latest,QWEN_TURBO_API_KEY=QWEN_TURBO_API_KEY:latest,QWEN_BASE_URL=QWEN_BASE_URL:latest" \
            --min-instances=1 \
            --allow-unauthenticated

      - name: Make Service Public
        run: |
          gcloud run services add-iam-policy-binding bot-tiendalasmotos-beta \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region="us-central1" \
            --project="tiendalasmotos"