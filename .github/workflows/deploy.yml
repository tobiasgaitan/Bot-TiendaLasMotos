name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          uvx google-agents-cli deploy \
            --no-confirm-project \
            --region us-central1 \
            --project tiendalasmotos \
            --update-env-vars="WEBHOOK_VERIFY_TOKEN=${{ secrets.WEBHOOK_VERIFY_TOKEN }},ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}"

      - name: Make Service Public
        run: |
          gcloud run services add-iam-policy-binding bot-tiendalasmotos \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region="us-central1" \
            --project="tiendalasmotos"