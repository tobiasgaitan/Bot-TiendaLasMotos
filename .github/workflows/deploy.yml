name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Pre-clone S-TOON Protocol
        run: |
          git clone https://github.com/azimuth-logic-research/S-TOON-Protocol.git S-TOON-Protocol
          mv S-TOON-Protocol/.git S-TOON-Protocol/git_dir

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # [BOT-BUILD-INFRA-TOKEN-ROTATION-201] IAM de mínimo privilegio: la SA de runtime
      # solo obtiene secretAccessor sobre el secreto individual. Idempotente.
      # Si el servicio usa una SA de runtime personalizada, ajustar --member.
      - name: Grant Secret Manager access to runtime SA
        run: |
          PROJECT_NUMBER=$(gcloud projects describe tiendalasmotos --format="value(projectNumber)") || {
            echo "❌ FORENSIC: no se pudo resolver projectNumber de tiendalasmotos"; exit 1; }
          gcloud secrets add-iam-policy-binding WHATSAPP_TOKEN \
            --project tiendalasmotos \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" || {
            echo "❌ FORENSIC: fallo IAM binding sobre el secreto WHATSAPP_TOKEN (bootstrap: gcloud secrets create WHATSAPP_TOKEN --replication-policy=automatic)"; exit 1; }

      # [BOT-BUILD-INFRA-TOKEN-ROTATION-201] Resolución de la versión ENABLED más reciente
      # para binding pineado (revisiones inmutables, rollback determinista).
      - name: Resolve latest enabled WHATSAPP_TOKEN secret version
        id: token_version
        run: |
          TOKEN_VERSION=$(gcloud secrets versions list WHATSAPP_TOKEN \
            --project tiendalasmotos \
            --filter="state=ENABLED" \
            --sort-by="~createTime" \
            --limit=1 \
            --format="value(name)" | awk -F/ '{print $NF}')
          if [ -z "$TOKEN_VERSION" ]; then
            echo "❌ FORENSIC: secreto WHATSAPP_TOKEN sin versiones ENABLED en tiendalasmotos."
            echo "   Bootstrap: printf '%s' '<system-user-token>' | gcloud secrets versions add WHATSAPP_TOKEN --data-file=-"
            exit 1
          fi
          echo "version=${TOKEN_VERSION}" >> "$GITHUB_OUTPUT"

      # [BOT-BUILD-CICD-SECRET-REF-204] Patrón atómico unificado (espejo de deploy-beta.yml).
      # WHATSAPP_TOKEN jamás viaja como literal en --set-env-vars: colisión de tipos
      # contra secretKeyRef ("Cannot update environment variable to string literal",
      # deploy job #88819603750). --set-env-vars reemplaza TODAS las env vars
      # literales, por lo que el binding del secreto se hace en el MISMO deploy
      # (--set-secrets): revisión atómica, sin ventana sin credencial.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bot-tiendalasmotos \
            --source . \
            --region us-central1 \
            --project tiendalasmotos \
            --set-env-vars="PHONE_NUMBER_ID=${{ secrets.PHONE_NUMBER_ID }},FIRESTORE_COLLECTION=prospectos,WEBHOOK_VERIFY_TOKEN=${{ secrets.WEBHOOK_VERIFY_TOKEN }},ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }},WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET }},LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }},LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }},LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}" \
            --set-secrets="WHATSAPP_TOKEN=WHATSAPP_TOKEN:${{ steps.token_version.outputs.version }}" \
            --allow-unauthenticated

      - name: Make Service Public
        run: |
          gcloud run services add-iam-policy-binding bot-tiendalasmotos \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region="us-central1" \
            --project="tiendalasmotos"